<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIAKAD Kelas B — Dashboard</title>
  <meta name="description" content="Dashboard SIAKAD Kelas B — Tugas, Jadwal, dan Absensi mahasiswa." />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

  <!-- Mobile sidebar overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="document.getElementById('sidebar').classList.remove('open');"></div>

  <div class="app-shell">

    <!-- ── Sidebar ── -->
    <aside class="sidebar" id="sidebar">
      <!-- built by router.js -->
    </aside>

    <!-- ── Topbar ── -->
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="topbar-burger" id="topbar-burger" aria-label="Menu">☰</button>
        <div>
          <div class="topbar-title" id="topbar-title">Beranda</div>
          <div class="topbar-sub"   id="topbar-sub">Ringkasan aktivitas hari ini</div>
        </div>
      </div>
      <div class="topbar-right">
        <span class="topbar-date" id="topbar-date"></span>
      </div>
    </header>

    <!-- ── Main Content ── -->
    <main class="main-content" id="main-content">
      <div class="empty-state" style="height:60vh">
        <div class="empty-state-icon">⏳</div>
        <p>Memuat...</p>
      </div>
    </main>

  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <!-- Scripts (order matters) -->
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/router.js"></script>
  <script src="js/homework.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/attendance.js"></script>

  <script>
    // Boot the app
    document.addEventListener('DOMContentLoaded', () => Router.init());
  </script>
</body>
</html>
